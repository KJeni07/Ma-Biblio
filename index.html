<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque - Édition Prestige</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&バランス" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f5f2; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        .gold-accent { color: #bc9c6a; }
        .bg-gold { background-color: #bc9c6a; }
        .border-gold { border-color: #bc9c6a; }
        .card-shadow { box-shadow: 0 10px 30px -15px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .card-shadow:hover { transform: translateY(-5px); }
        .star-active { color: #bc9c6a; }
        .star-inactive { color: #d1d5db; }
        .modal { backdrop-filter: blur(4px); background-color: rgba(0,0,0,0.4); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="serif text-5xl mb-2 font-bold uppercase tracking-widest">Ma Bibliothèque</h1>
            <p class="text-gray-500 italic">Édition Prestige & Archives</p>
            <div class="w-24 h-1 bg-gold mx-auto mt-4"></div>
        </header>

        <!-- Formulaire d'Ajout -->
        <section class="bg-white p-8 rounded-lg card-shadow mb-12 border-t-4 border-gold">
            <h2 class="serif text-2xl mb-6 flex items-center"><span class="mr-3">⊕</span> Ajouter un Ouvrage</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <!-- Titre et Auteur sur la même ligne -->
                <div class="md:col-span-5">
                    <label class="block text-xs uppercase tracking-wider font-semibold mb-1 text-gray-500">Titre de l'œuvre</label>
                    <input type="text" id="in-title" class="w-full border-b-2 border-gray-200 p-2 focus:border-gold outline-none transition-all" placeholder="Ex: Les Misérables">
                </div>
                <div class="md:col-span-5">
                    <label class="block text-xs uppercase tracking-wider font-semibold mb-1 text-gray-500">Auteur</label>
                    <input type="text" id="in-author" class="w-full border-b-2 border-gray-200 p-2 focus:border-gold outline-none transition-all" placeholder="Ex: Victor Hugo">
                </div>
                <!-- Bouton rechercher réduit -->
                <div class="md:col-span-2">
                    <button onclick="searchBook()" class="w-full bg-black text-white py-2 px-4 text-sm hover:bg-gray-800 transition-all uppercase tracking-tighter">Chercher</button>
                </div>

                <!-- Autres champs -->
                <div class="md:col-span-3">
                    <label class="block text-xs uppercase tracking-wider font-semibold mb-1 text-gray-500">Note (0 à 5 par 0,5)</label>
                    <input type="number" id="in-rating" step="0.5" min="0" max="5" class="w-full border-b-2 border-gray-200 p-2 focus:border-gold outline-none" value="0">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs uppercase tracking-wider font-semibold mb-1 text-gray-500">Genre</label>
                    <input type="text" id="in-genre" class="w-full border-b-2 border-gray-200 p-2 focus:border-gold outline-none">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs uppercase tracking-wider font-semibold mb-1 text-gray-500">Format</label>
                    <select id="in-format" class="w-full border-b-2 border-gray-200 p-2 focus:border-gold outline-none bg-transparent">
                        <option value="Physique">Physique</option>
                        <option value="Numérique">Numérique</option>
                        <option value="Audio">Audio</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <button onclick="addBook()" class="w-full bg-gold text-white py-2 font-bold hover:opacity-90 transition-all shadow-lg">ARCHIVER</button>
                </div>
            </div>
        </section>

        <!-- Filtres et Liste -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="relative w-full md:w-64">
                <input type="text" id="search-bar" onkeyup="renderLibrary()" placeholder="Filtrer mes archives..." class="w-full bg-transparent border-b border-gray-400 p-2 outline-none italic">
            </div>
            <div class="flex gap-2">
                <button onclick="filterRating(null)" class="text-xs border border-gray-300 px-3 py-1 hover:border-gold transition-colors">TOUS</button>
                <button onclick="filterRating(5)" class="text-xs border border-gray-300 px-3 py-1 hover:border-gold transition-colors">★★★★★</button>
            </div>
        </div>

        <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Les livres s'afficheront ici -->
        </div>
    </div>

    <!-- MODAL D'ÉDITION -->
    <div id="edit-modal" class="modal fixed inset-0 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-2xl p-8 rounded-lg shadow-2xl border-t-8 border-gold max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-6">
                <h3 class="serif text-3xl uppercase tracking-widest">Modifier la Fiche</h3>
                <button onclick="closeModal()" class="text-2xl hover:text-gold">&times;</button>
            </div>
            <div id="modal-id" class="hidden"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="edit-fields">
                <!-- Les champs d'édition sont injectés ici ou gérés via window.openEdit -->
            </div>
            <div class="mt-8 flex justify-end gap-4">
                <button onclick="closeModal()" class="px-6 py-2 border border-gray-300 hover:bg-gray-50 transition-all">ANNULER</button>
                <button onclick="saveEdit()" class="px-6 py-2 bg-black text-white hover:bg-gray-800 transition-all shadow-md">ENREGISTRER</button>
            </div>
        </div>
    </div>

    <script>
        let library = [];

        // Système d'étoiles avec gestion des demi-points
        function getStars(rating) {
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    starsHtml += '<span class="star-active">★</span>';
                } else if (rating >= i - 0.5) {
                    // Caractère demi-étoile (ou étoile pleine dorée pour simplifier visuellement)
                    starsHtml += '<span class="star-active">⯪</span>'; 
                } else {
                    starsHtml += '<span class="star-inactive">★</span>';
                }
            }
            return starsHtml;
        }

        async function searchBook() {
            const title = document.getElementById('in-title').value;
            if (!title) return;
            const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}`);
            const data = await res.json();
            if (data.items && data.items[0]) {
                const info = data.items[0].volumeInfo;
                document.getElementById('in-author').value = info.authors ? info.authors[0] : "";
                document.getElementById('in-genre').value = info.categories ? info.categories[0] : "";
            }
        }

        function addBook() {
            const book = {
                id: Date.now().toString(),
                title: document.getElementById('in-title').value,
                author: document.getElementById('in-author').value,
                rating: parseFloat(document.getElementById('in-rating').value) || 0,
                genre: document.getElementById('in-genre').value,
                format: document.getElementById('in-format').value,
                cover: "https://via.placeholder.com/150x200?text=Livre" 
            };
            library.push(book);
            renderLibrary();
            // Reset
            document.getElementById('in-title').value = "";
            document.getElementById('in-author').value = "";
        }

        function renderLibrary(filterVal = null) {
            const grid = document.getElementById('library-grid');
            const search = document.getElementById('search-bar').value.toLowerCase();
            grid.innerHTML = "";

            library.filter(b => {
                const matchSearch = b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search);
                return matchSearch;
            }).forEach(b => {
                grid.innerHTML += `
                    <div class="bg-white p-6 rounded-lg card-shadow border border-gray-100 flex gap-4">
                        <img src="${b.cover}" class="w-24 h-36 object-cover shadow-md">
                        <div class="flex-1">
                            <p class="text-xs text-gold font-bold uppercase mb-1">${b.genre}</p>
                            <h3 class="serif text-xl font-bold leading-tight mb-1">${b.title}</h3>
                            <p class="text-gray-600 text-sm mb-2 italic">par ${b.author}</p>
                            <div class="text-lg mb-3">${getStars(b.rating)}</div>
                            <div class="flex gap-2">
                                <button onclick="openEdit('${b.id}')" class="text-[10px] tracking-tighter border border-gray-300 px-2 py-1 hover:bg-gray-50">MODIFIER</button>
                                <button onclick="deleteBook('${b.id}')" class="text-[10px] tracking-tighter border border-red-200 text-red-400 px-2 py-1 hover:bg-red-50">SUPPRIMER</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.openEdit = (id) => {
            const b = library.find(x => x.id === id);
            const modalBody = document.getElementById('edit-fields');
            document.getElementById('modal-id').innerText = id;
            
            // On génère dynamiquement les champs pour la modale
            modalBody.innerHTML = `
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Titre</label>
                    <input type="text" id="edit-title" value="${b.title}" class="w-full border-b p-2 outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Auteur</label>
                    <input type="text" id="edit-author" value="${b.author}" class="w-full border-b p-2 outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Note (ex: 4.5)</label>
                    <input type="number" id="edit-rating" step="0.5" min="0" max="5" value="${b.rating}" class="w-full border-b p-2 outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Genre</label>
                    <input type="text" id="edit-genre" value="${b.genre}" class="w-full border-b p-2 outline-none focus:border-gold">
                </div>
            `;
            
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.saveEdit = () => {
            const id = document.getElementById('modal-id').innerText;
            const index = library.findIndex(x => x.id === id);
            if(index !== -1) {
                library[index].title = document.getElementById('edit-title').value;
                library[index].author = document.getElementById('edit-author').value;
                library[index].rating = parseFloat(document.getElementById('edit-rating').value);
                library[index].genre = document.getElementById('edit-genre').value;
                renderLibrary();
                closeModal();
            }
        };

        window.deleteBook = (id) => {
            if(confirm("Voulez-vous supprimer cet archive ?")) {
                library = library.filter(x => x.id !== id);
                renderLibrary();
            }
        };

        window.closeModal = () => document.getElementById('edit-modal').classList.add('hidden');
    </script>
</body>
</html>
