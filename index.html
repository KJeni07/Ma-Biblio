<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Biblio 100 - Édition Prestige HD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #FAF9F6;
            --gold-accent: #C5A059;
            --deep-black: #1A1A1A;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--paper-bg);
            color: var(--deep-black);
            overflow-x: hidden;
        }

        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .tab-btn {
            padding-bottom: 12px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #94a3b8;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--gold-accent);
            border-bottom: 3px solid var(--gold-accent);
        }

        .fiche-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            max-width: 900px;
            margin: 0 auto 40px auto;
            position: relative;
            border: 1px solid rgba(197, 160, 89, 0.1);
        }

        .fiche-number {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 16px;
            font-weight: 900;
            color: #f1f1f1;
        }

        .fiche-title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--deep-black);
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .fiche-author {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 30px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .cover-box {
            width: 100%; max-width: 200px; aspect-ratio: 2/3;
            background: #eee; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .grid-thumb {
            width: 100%; aspect-ratio: 2/3; background: white;
            border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px; transition: all 0.3s; overflow: hidden;
        }
        .grid-thumb:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(197, 160, 89, 0.15); }

        .modal-input {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px;
            margin-bottom: 12px; font-size: 14px; background-color: #fff;
        }
        .star-filled { color: var(--gold-accent); }
        .star-empty { color: #e5e7eb; }
        
        /* Dashboard */
        .stat-card {
            background: white; padding: 25px; border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.1); text-align: center;
        }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 900; color: var(--gold-accent); }
    </style>
</head>
<body>

    <!-- AUTHENTIFICATION -->
    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-[#FAF9F6]">
        <div class="bg-white w-full max-w-md rounded-3xl p-10 text-center border border-gold-accent/20 shadow-xl">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter font-serif mb-8">Ma Biblio <span class="text-[#C5A059]">100</span></h1>
            <form id="auth-form" class="space-y-5 text-left">
                <input type="email" id="email" required class="modal-input" placeholder="Email">
                <input type="password" id="password" required class="modal-input" placeholder="Mot de passe">
                <button type="submit" id="auth-submit-btn" class="w-full py-4 bg-[#C5A059] text-white rounded-xl font-bold uppercase text-xs tracking-widest">Se connecter</button>
            </form>
            <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="mt-6 text-[10px] text-gray-400 font-bold uppercase tracking-widest hover:text-[#C5A059]">S'inscrire</button>
        </div>
    </div>

    <!-- APP CONTENT -->
    <div id="app-content" class="hidden max-w-6xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black italic uppercase font-serif">Ma Biblio <span class="text-[#C5A059]">100</span></h1>
            <button onclick="logout()" class="text-[10px] font-bold uppercase text-red-400">Quitter</button>
        </div>

        <div class="flex gap-10 border-b border-slate-100 mb-8">
            <button onclick="showSection('stats')" id="btn-stats" class="tab-btn active">Stats</button>
            <button onclick="showSection('grille')" id="btn-grille" class="tab-btn">Grille</button>
            <button onclick="showSection('fiches')" id="btn-fiches" class="tab-btn">Fiches</button>
        </div>

        <div id="search-bar-container" class="mb-8 hidden">
            <input type="text" id="search-input" oninput="render()" placeholder="Rechercher..." class="w-full p-3 border rounded-xl outline-none focus:border-[#C5A059]">
        </div>

        <!-- SECTIONS -->
        <section id="section-stats" class="view-section active">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="stat-card"><p class="section-label">Lus</p><div id="stat-count" class="stat-value">0</div></div>
                <div class="stat-card"><p class="section-label">Note</p><div id="stat-avg" class="stat-value">0.0</div></div>
                <div class="stat-card text-left px-8"><p class="section-label text-center">Top Genres</p><div id="genre-podium"></div></div>
            </div>
            <div class="h-64 bg-white p-6 rounded-2xl border border-slate-100"><canvas id="readingChart"></canvas></div>
        </section>

        <section id="section-grille" class="view-section">
            <div id="grid-content" class="grid grid-cols-2 md:grid-cols-5 gap-10"></div>
        </section>

        <section id="section-fiches" class="view-section">
            <div id="fiches-content" class="space-y-20"></div>
        </section>
    </div>

    <!-- MODAL EDITION -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black mb-6 uppercase font-serif">Modifier Fiche #<span id="modal-id"></span></h2>
            
            <div class="mb-6 p-4 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                <p class="text-[10px] font-black uppercase text-[#C5A059] mb-2">Auto-Remplissage</p>
                <div class="flex gap-2">
                    <input id="in-title" class="modal-input !mb-0" placeholder="Titre du livre">
                    <button onclick="fetchBookInfo()" class="px-4 bg-black text-white rounded-lg text-[10px] font-bold uppercase hover:bg-[#C5A059]">Rechercher 🔍</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="in-author" class="modal-input" placeholder="Auteur">
                <input id="in-genre" class="modal-input" placeholder="Genre">
                <input id="in-cover" class="modal-input md:col-span-2" placeholder="URL de l'image (HD)">
                <select id="in-rating" class="modal-input"><option value="0">Note /5</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
                <input id="in-lang" class="modal-input" placeholder="Langue">
                <input id="in-start" class="modal-input" placeholder="Début (JJ/MM)">
                <input id="in-end" class="modal-input" placeholder="Fin (JJ/MM)">
            </div>
            <textarea id="in-summary" class="modal-input h-24" placeholder="Résumé"></textarea>
            <textarea id="in-comment" class="modal-input h-24" placeholder="Mon avis"></textarea>
            <div class="flex gap-3"><button onclick="closeModal()" class="flex-1 py-4 bg-slate-100 rounded-xl font-bold uppercase text-[10px]">Annuler</button><button onclick="saveToFirebase()" class="flex-1 py-4 bg-[#C5A059] text-white rounded-xl font-bold uppercase text-[10px]">Enregistrer</button></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALZ0tu1jU2OJbGrAmCcAFXVFB5os4-pfY",
            authDomain: "ma-biblio-b7966.firebaseapp.com",
            projectId: "ma-biblio-b7966",
            storageBucket: "ma-biblio-b7966.firebasestorage.app",
            messagingSenderId: "1025405426041",
            appId: "1:1025405426041:web:75b75d6c45a2f0313ef7a8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let library = [];
        let isSignUp = false;
        let currentUser = null;
        let readingChart = null;

        // --- RECHERCHE AMELIOREE ---
        window.fetchBookInfo = async () => {
            const title = document.getElementById('in-title').value;
            if (!title) return alert("Tapez un titre !");
            
            try {
                // On force la langue FR pour de meilleurs résumés
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}&maxResults=1&langRestrict=fr`);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const info = data.items[0].volumeInfo;
                    
                    document.getElementById('in-author').value = info.authors ? info.authors.join(', ') : '';
                    document.getElementById('in-genre').value = info.categories ? info.categories[0] : '';
                    
                    // Nettoyage HTML du résumé
                    let desc = info.description || "";
                    document.getElementById('in-summary').value = desc.replace(/<[^>]*>?/gm, '');
                    
                    // Boost de la résolution image
                    if (info.imageLinks) {
                        let img = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail;
                        // On force le HTTPS, on passe en Zoom 2 (HD) et on enlève les bords tournés
                        let hdImg = img.replace('http:', 'https:')
                                       .replace('&zoom=1', '&zoom=2')
                                       .replace('&edge=curl', '');
                        document.getElementById('in-cover').value = hdImg;
                    }
                    alert("Données HD récupérées !");
                } else {
                    alert("Livre non trouvé.");
                }
            } catch (err) { alert("Erreur de recherche."); }
        };

        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "S'inscrire" : "Se connecter";
        };

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (isSignUp) await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                await loadUserLibrary();
            } else {
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.logout = () => signOut(auth);

        async function loadUserLibrary() {
            const docRef = doc(db, "users_libs", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                library = docSnap.data().books;
            } else {
                library = Array.from({length: 100}, (_, i) => ({
                    id: i + 1, title: "", author: "", cover: "", rating: 0, summary: "", comment: "", genre: "", lang: "", start: "", end: ""
                }));
                await setDoc(docRef, { books: library });
            }
            render();
        }

        window.saveToFirebase = async () => {
            const id = parseInt(document.getElementById('modal-id').innerText);
            const idx = library.findIndex(b => b.id === id);
            library[idx] = {
                id: id,
                title: document.getElementById('in-title').value,
                author: document.getElementById('in-author').value,
                cover: document.getElementById('in-cover').value,
                rating: parseInt(document.getElementById('in-rating').value),
                genre: document.getElementById('in-genre').value,
                lang: document.getElementById('in-lang').value,
                start: document.getElementById('in-start').value,
                end: document.getElementById('in-end').value,
                summary: document.getElementById('in-summary').value,
                comment: document.getElementById('in-comment').value
            };
            await setDoc(doc(db, "users_libs", currentUser.uid), { books: library });
            render();
            closeModal();
        };

        window.render = () => {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const readBooks = library.filter(b => b.title.trim() !== "");
            
            // Dashboard
            document.getElementById('stat-count').innerText = readBooks.length;
            const avg = readBooks.length > 0 ? (readBooks.reduce((acc, b) => acc + b.rating, 0) / readBooks.length).toFixed(1) : "0.0";
            document.getElementById('stat-avg').innerText = avg;

            // Grille
            document.getElementById('grid-content').innerHTML = library.map(book => `
                <div class="cursor-pointer" onclick="jumpToFiche(${book.id})">
                    <div class="grid-thumb">
                        ${book.cover ? `<img src="${book.cover}" referrerpolicy="no-referrer" class="w-full h-full object-cover">` : `<span class="text-slate-200 font-bold text-[10px]">VIDE</span>`}
                    </div>
                </div>
            `).join('');

            // Fiches
            document.getElementById('fiches-content').innerHTML = library.filter(b => b.title.includes(searchTerm)).map(book => `
                <div id="fiche-scroll-${book.id}" class="fiche-container">
                    <div class="fiche-number">#${book.id}</div>
                    <div class="flex flex-col md:flex-row gap-10">
                        <div class="cover-box shrink-0">
                            ${book.cover ? `<img src="${book.cover}" referrerpolicy="no-referrer" class="w-full h-full object-cover">` : `<span class="text-4xl text-slate-200">?</span>`}
                        </div>
                        <div class="flex-1">
                            <h2 class="fiche-title">${book.title || 'SANS TITRE'}</h2>
                            <h3 class="fiche-author">${book.author || 'Inconnu'}</h3>
                            <div class="flex gap-1 mb-6">${[1,2,3,4,5].map(i => `<span class="${i <= book.rating ? 'star-filled' : 'star-empty'}">★</span>`).join('')}</div>
                            <p class="section-label">Résumé</p>
                            <p class="text-sm italic text-gray-600">${book.summary || '...'}</p>
                        </div>
                    </div>
                    <div class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4 border-t pt-4">
                        <div><p class="section-label">Genre</p><p class="text-xs font-bold">${book.genre || '-'}</p></div>
                        <div><p class="section-label">Langue</p><p class="text-xs font-bold">${book.lang || '-'}</p></div>
                        <div><p class="section-label">Début</p><p class="text-xs font-bold">${book.start || '-'}</p></div>
                        <div><p class="section-label">Fin</p><p class="text-xs font-bold">${book.end || '-'}</p></div>
                    </div>
                    <div class="mt-6 flex justify-end"><button onclick="openEdit(${book.id})" class="px-4 py-2 bg-slate-50 text-[10px] font-bold uppercase rounded-lg">Modifier</button></div>
                </div>
            `).join('');

            updateChart(readBooks);
        };

        function updateChart(books) {
            const counts = new Array(12).fill(0);
            books.forEach(b => { if(b.end && b.end.includes('/')) { const m = parseInt(b.end.split('/')[1]); if(m) counts[m-1]++; }});
            const ctx = document.getElementById('readingChart').getContext('2d');
            if(readingChart) readingChart.destroy();
            readingChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ["J","F","M","A","M","J","J","A","S","O","N","D"], datasets: [{ data: counts, borderColor: '#C5A059', fill: true, backgroundColor: 'rgba(197, 160, 89, 0.05)', tension: 0.4 }]},
                options: { plugins: { legend: { display: false }}, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }}}}
            });
        }

        window.showSection = (id) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('search-bar-container').classList.toggle('hidden', id === 'stats');
        };

        window.jumpToFiche = (id) => { showSection('fiches'); setTimeout(() => { document.getElementById('fiche-scroll-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100); };

        window.openEdit = (id) => {
            const b = library.find(x => x.id === id);
            document.getElementById('modal-id').innerText = id;
            document.getElementById('in-title').value = b.title;
            document.getElementById('in-author').value = b.author;
            document.getElementById('in-cover').value = b.cover;
            document.getElementById('in-rating').value = b.rating;
            document.getElementById('in-genre').value = b.genre;
            document.getElementById('in-lang').value = b.lang;
            document.getElementById('in-start').value = b.start;
            document.getElementById('in-end').value = b.end;
            document.getElementById('in-summary').value = b.summary;
            document.getElementById('in-comment').value = b.comment;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('edit-modal').classList.add('hidden');
    </script>
</body>
</html>
