<!DOCTYPE html>
<html lang="fr">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Biblio 100 - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --paper-bg: #FAF9F6; --gold-accent: #C5A059; --deep-black: #1A1A1A; }
        body { font-family: 'Inter', sans-serif; background-color: var(--paper-bg); color: var(--deep-black); margin: 0; }
        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }

        .tab-btn {
            padding-bottom: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: #94a3b8; border-bottom: 3px solid transparent; cursor: pointer;
        }
        .tab-btn.active { color: var(--gold-accent); border-bottom: 3px solid var(--gold-accent); }

        .stat-card {
            background: white; padding: 25px; border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; color: var(--gold-accent); }

        .grid-thumb {
            width: 100%; aspect-ratio: 2/3; background: #f0f0f0; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .grid-thumb:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(197, 160, 89, 0.15); }
        
        .fiche-container {
            background: white; border-radius: 12px; padding: 40px; max-width: 900px;
            margin: 0 auto 40px auto; border: 1px solid rgba(197, 160, 89, 0.1);
        }
        .modal-input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
        .btn-gold-main { background-color: var(--gold-accent); color: white; }
    </style>
</head>
<body>

    <!-- AUTHENTIFICATION -->
    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-[#FAF9F6]">
        <div class="bg-white w-full max-w-md rounded-3xl p-10 text-center border border-gold-accent/20 shadow-xl">
            <h1 class="text-3xl font-black italic uppercase font-serif mb-8">Ma Biblio <span class="text-[#C5A059]">100</span></h1>
            <form id="auth-form" class="space-y-4 text-left">
                <input type="email" id="email" required class="modal-input" placeholder="Email">
                <input type="password" id="password" required class="modal-input" placeholder="Mot de passe">
                <button type="submit" id="auth-submit-btn" class="w-full py-4 btn-gold-main rounded-xl font-bold uppercase text-xs tracking-widest">Connexion</button>
            </form>
            <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="mt-6 text-[10px] text-gray-400 font-bold uppercase tracking-widest">S'inscrire</button>
        </div>
    </div>

    <!-- APP CONTENU -->
    <div id="app-content" class="hidden opacity-0 transition-opacity duration-700">
        <div class="max-w-6xl mx-auto px-6 py-10">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-black italic uppercase font-serif">Ma Biblio <span class="text-[#C5A059]">100</span></h1>
                <button onclick="logout()" class="text-[10px] font-bold uppercase tracking-widest px-4 py-2 text-red-400 border border-red-100 rounded-lg">Quitter</button>
            </div>

            <!-- NAVIGATION -->
            <div class="flex gap-10 border-b border-slate-100 mb-8">
                <button onclick="showSection('stats')" id="btn-stats" class="tab-btn active">Tableau de Bord</button>
                <button onclick="showSection('grille')" id="btn-grille" class="tab-btn">Ma Grille</button>
                <button onclick="showSection('fiches')" id="btn-fiches" class="tab-btn">Mes Fiches</button>
            </div>

            <!-- RECHERCHE -->
            <div id="search-bar-container" class="mb-8 flex flex-col md:flex-row gap-4 hidden">
                <input type="text" id="search-input" oninput="render()" placeholder="Titre, auteur, genre..." class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none">
                <select id="filter-rating" onchange="render()" class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm">
                    <option value="all">Toutes les notes</option>
                    <option value="5">⭐⭐⭐⭐⭐</option>
                    <option value="0">Sans note</option>
                </select>
            </div>

            <!-- SECTION STATS -->
            <section id="section-stats" class="view-section active">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
                    <div class="stat-card flex flex-col justify-center">
                        <p class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-2">Progression</p>
                        <div id="stat-count" class="stat-value">0</div>
                        <p class="text-xs text-slate-500">Livres lus sur 100</p>
                    </div>
                    <div class="stat-card flex flex-col justify-center">
                        <p class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-2">Note Moyenne</p>
                        <div id="stat-avg" class="stat-value">0.0</div>
                        <p class="text-xs text-slate-500">Satisfaction globale</p>
                    </div>
                    <div class="stat-card">
                        <p class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-4 text-center">Podium des Genres</p>
                        <div id="genre-podium" class="space-y-3">
                            <!-- JS injectera le podium ici -->
                        </div>
                    </div>
                </div>
                <div class="stat-card p-8">
                    <p class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-6">Lectures par Mois</p>
                    <canvas id="monthlyChart" height="100"></canvas>
                </div>
            </section>

            <!-- SECTION GRILLE -->
            <section id="section-grille" class="view-section">
                <div id="grid-content" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-10"></div>
            </section>

            <!-- SECTION FICHES -->
            <section id="section-fiches" class="view-section">
                <div id="fiches-content" class="space-y-20"></div>
            </section>
        </div>
    </div>

    <!-- MODAL EDIT -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <h2 class="text-2xl font-black mb-6 font-serif uppercase">Modifier #<span id="modal-id"></span></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="in-title" placeholder="Titre" class="modal-input">
                <input id="in-author" placeholder="Auteur" class="modal-input">
                <input id="in-cover" placeholder="URL Image" class="modal-input md:col-span-2">
                <input id="in-genre" placeholder="Genre (ex: Fantasy)" class="modal-input">
                <select id="in-rating" class="modal-input"><option value="0">Note</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
                <input id="in-end" placeholder="Mois de fin (ex: Mai)" class="modal-input">
            </div>
            <textarea id="in-summary" class="modal-input h-20" placeholder="Résumé"></textarea>
            <textarea id="in-comment" class="modal-input h-20" placeholder="Mon avis"></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold uppercase text-[10px]">Annuler</button>
                <button onclick="saveToFirebase()" class="flex-1 py-3 btn-gold-main rounded-xl font-bold uppercase text-[10px]">Enregistrer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALZ0tu1jU2OJbGrAmCcAFXVFB5os4-pfY",
            authDomain: "ma-biblio-b7966.firebaseapp.com",
            projectId: "ma-biblio-b7966",
            storageBucket: "ma-biblio-b7966.firebasestorage.app",
            messagingSenderId: "1025405426041",
            appId: "1:1025405426041:web:75b75d6c45a2f0313ef7a8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let library = [];
        let currentUser = null;
        let isSignUp = false;
        let myChart = null;

        // AUTH LOGIC
        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "S'inscrire" : "Connexion";
        };

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (isSignUp) await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                setTimeout(() => document.getElementById('app-content').classList.add('opacity-100'), 50);
                await loadLibrary();
            } else {
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.logout = () => signOut(auth);

        async function loadLibrary() {
            const snap = await getDoc(doc(db, "users_libs", currentUser.uid));
            if (snap.exists()) {
                library = snap.data().books;
            } else {
                library = Array.from({length: 100}, (_, i) => ({ id: i + 1, title: "", author: "", cover: "", rating: 0, summary: "", comment: "", genre: "", end: "" }));
                await setDoc(doc(db, "users_libs", currentUser.uid), { books: library });
            }
            render();
        }

        window.saveToFirebase = async () => {
            const id = parseInt(document.getElementById('modal-id').innerText);
            const idx = library.findIndex(b => b.id === id);
            library[idx] = {
                id: id,
                title: document.getElementById('in-title').value,
                author: document.getElementById('in-author').value,
                cover: document.getElementById('in-cover').value,
                genre: document.getElementById('in-genre').value,
                rating: parseInt(document.getElementById('in-rating').value),
                end: document.getElementById('in-end').value,
                summary: document.getElementById('in-summary').value,
                comment: document.getElementById('in-comment').value
            };
            await setDoc(doc(db, "users_libs", currentUser.uid), { books: library });
            render();
            closeModal();
        };

        window.render = () => {
            const search = document.getElementById('search-input').value.toLowerCase();
            const readBooks = library.filter(b => b.title.trim() !== "");
            
            // STATS : CALCULS
            document.getElementById('stat-count').innerText = readBooks.length;
            const avg = readBooks.length > 0 ? (readBooks.reduce((acc, b) => acc + b.rating, 0) / readBooks.length).toFixed(1) : "0.0";
            document.getElementById('stat-avg').innerText = avg;

            // PODIUM GENRES
            const genreMap = {};
            readBooks.forEach(b => { if(b.genre) genreMap[b.genre] = (genreMap[b.genre] || 0) + 1 });
            const sortedGenres = Object.entries(genreMap).sort((a,b) => b[1] - a[1]).slice(0, 3);
            
            document.getElementById('genre-podium').innerHTML = sortedGenres.length ? sortedGenres.map((g, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                    <span class="text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full bg-white border border-gold-accent/20">${i+1}</span>
                    <span class="text-[11px] font-bold flex-1 ml-3 truncate">${g[0]}</span>
                    <span class="text-[10px] font-black text-gold-accent">${g[1]} fiches</span>
                </div>
            `).join('') : '<p class="text-center text-xs text-gray-300 italic py-4">Pas encore assez de données</p>';

            // CHART
            updateChart(readBooks);

            // GRILLE (Filtre appliqué)
            const filtered = library.filter(b => (b.title + b.author + b.genre).toLowerCase().includes(search));
            document.getElementById('grid-content').innerHTML = filtered.map(book => `
                <div class="cursor-pointer group" onclick="jumpToFiche(${book.id})">
                    <div class="grid-thumb">
                        ${book.cover ? `<img src="${book.cover}" class="w-full h-full object-cover">` : `<span class="text-[40px] font-black text-slate-100">?</span>`}
                    </div>
                    <div class="flex justify-center mt-2 gap-0.5">${[1,2,3,4,5].map(i => `<span class="text-[10px] ${i <= book.rating ? 'text-[#C5A059]' : 'text-slate-200'}">★</span>`).join('')}</div>
                </div>
            `).join('');

            // FICHES (Même contenu que précédemment)
            document.getElementById('fiches-content').innerHTML = filtered.map(book => `
                <div id="fiche-scroll-${book.id}" class="fiche-container">
                    <div class="flex flex-col md:flex-row gap-10">
                        <div class="w-40 h-60 bg-slate-100 rounded shadow-lg overflow-hidden shrink-0">
                            <img src="${book.cover}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <h2 class="text-2xl font-black font-serif uppercase">${book.title || 'SANS TITRE'}</h2>
                            <p class="text-gold-accent font-bold text-xs uppercase mb-4">${book.author || 'Inconnu'}</p>
                            <p class="text-xs text-gray-400 uppercase font-black mb-1">Résumé</p>
                            <p class="text-sm italic text-gray-600 mb-6">${book.summary || '...'}</p>
                            <button onclick="openEdit(${book.id})" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-gold-accent transition-colors">Modifier la fiche</button>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        function updateChart(books) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            const dataCounts = months.map(m => books.filter(b => b.end && b.end.toLowerCase().includes(m.toLowerCase())).length);

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Livres lus',
                        data: dataCounts,
                        backgroundColor: 'rgba(197, 160, 89, 0.4)',
                        borderColor: '#C5A059',
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        window.showSection = (id) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('search-bar-container').classList.toggle('hidden', id === 'stats');
        };

        window.jumpToFiche = (id) => {
            showSection('fiches');
            setTimeout(() => {
                document.getElementById('fiche-scroll-' + id).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        };

        window.openEdit = (id) => {
            const b = library.find(x => x.id === id);
            document.getElementById('modal-id').innerText = id;
            document.getElementById('in-title').value = b.title;
            document.getElementById('in-author').value = b.author;
            document.getElementById('in-cover').value = b.cover;
            document.getElementById('in-genre').value = b.genre;
            document.getElementById('in-rating').value = b.rating;
            document.getElementById('in-end').value = b.end;
            document.getElementById('in-summary').value = b.summary;
            document.getElementById('in-comment').value = b.comment;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('edit-modal').classList.add('hidden');
    </script>
</body>
</html>
