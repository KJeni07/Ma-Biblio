<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Biblio 100 - Édition Prestige</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #FAF9F6;
            --gold-accent: #C5A059;
            --deep-black: #1A1A1A;
            --muted-gold: #D4AF37;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--paper-bg);
            color: var(--deep-black);
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }

        /* --- AUTHENTIFICATION --- */
        #auth-screen {
            background-color: var(--paper-bg);
            background-image: radial-gradient(rgba(197, 160, 89, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .auth-card {
            background: white;
            border: 1px solid rgba(197, 160, 89, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        /* --- APP STYLE --- */
        .view-section { display: none; }
        .view-section.active { display: block; }

        .tab-btn {
            padding-bottom: 12px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #94a3b8;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--gold-accent);
            border-bottom: 3px solid var(--gold-accent);
        }

        /* --- STYLE FICHE --- */
        .fiche-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            max-width: 900px;
            margin: 0 auto 40px auto;
            position: relative;
            border: 1px solid rgba(197, 160, 89, 0.1);
        }

        .fiche-number {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 16px;
            font-weight: 900;
            color: #f1f1f1;
        }

        .fiche-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--deep-black);
            line-height: 1.1;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .fiche-author {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 30px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .fiche-summary { font-size: 15px; color: #444; font-style: italic; line-height: 1.6; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #f9f9f9;
        }
        @media (min-width: 768px) { .info-grid { grid-template-columns: repeat(5, 1fr); } }

        .info-item { border-bottom: 2px solid #f9f9f9; padding-bottom: 8px; }
        .info-value { font-size: 13px; font-weight: 700; color: var(--deep-black); }

        .avis-box {
            background-color: #fcfbf8;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            min-height: 60px;
            border-left: 4px solid var(--gold-accent);
        }

        .cover-box {
            width: 100%; max-width: 200px; aspect-ratio: 2/3;
            background: #eee; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            align-self: flex-start;
        }

        /* --- STYLE GRILLE --- */
        .grid-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .grid-thumb {
            width: 100%; aspect-ratio: 2/3; background: white;
            border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px; transition: all 0.3s; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .grid-thumb:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(197, 160, 89, 0.15); }

        /* --- DASHBOARD STATS --- */
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 900; color: var(--gold-accent); }
        
        .podium-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background: #fcfbf8; border-radius: 12px; margin-bottom: 8px;
            border: 1px solid #f0f0f0;
        }
        .rank-badge {
            width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 10px; font-weight: 900; color: white;
        }

        /* --- UI UTILS --- */
        .modal-input {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px;
            margin-bottom: 12px; font-size: 14px; background-color: #fff;
        }
        .modal-input:focus { outline: none; border-color: var(--gold-accent); }
        .star-filled { color: var(--gold-accent); }
        .star-empty { color: #e5e7eb; }
        .btn-gold-main { background-color: var(--gold-accent); color: white; transition: all 0.2s; }
        .btn-gold-main:hover { background-color: #A68548; }

        /* Loader pour l'automatisation */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--gold-accent);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6">
        <div class="auth-card w-full max-w-md rounded-3xl p-10 text-center">
            <div class="mb-8">
                <h1 class="text-3xl font-black italic uppercase tracking-tighter font-serif mb-2">
                    Ma Biblio <span style="color: var(--gold-accent)">100</span>
                </h1>
                <p id="auth-mode-title" class="text-[10px] uppercase tracking-[0.2em] text-gray-400 font-bold">Connexion Membre</p>
            </div>
            <form id="auth-form" class="space-y-5 text-left">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Adresse Email</label>
                    <input type="email" id="email" required class="modal-input !mb-0" placeholder="exemple@mail.com">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Mot de passe</label>
                    <input type="password" id="password" required class="modal-input !mb-0" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-4 btn-gold-main rounded-xl font-bold uppercase tracking-widest text-xs shadow-lg mt-4">Ouvrir ma collection</button>
            </form>
            <p id="auth-error" class="text-red-500 text-[11px] mt-4 font-bold uppercase hidden"></p>
            <div class="mt-6">
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest hover:text-gold-accent">Pas encore de compte ? S'inscrire</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="hidden opacity-0 transition-opacity duration-700">
        <div class="max-w-6xl mx-auto px-6 py-10">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
                <h1 class="text-3xl font-black italic uppercase tracking-tighter font-serif">Ma Biblio <span style="color: var(--gold-accent)">100</span></h1>
                <div class="flex items-center gap-3">
                    <span id="user-display" class="text-[10px] font-bold text-gray-400 uppercase mr-2"></span>
                    <button onclick="logout()" class="text-[10px] font-bold uppercase tracking-widest px-4 py-2 text-red-400 hover:text-red-600 border border-red-100 rounded-lg">Quitter</button>
                </div>
            </div>

            <div class="flex gap-10 border-b border-slate-100 mb-8">
                <button onclick="showSection('stats')" id="btn-stats" class="tab-btn active">Tableau de Bord</button>
                <button onclick="showSection('grille')" id="btn-grille" class="tab-btn">Ma Grille</button>
                <button onclick="showSection('fiches')" id="btn-fiches" class="tab-btn">Mes Fiches</button>
            </div>

            <div id="search-bar-container" class="mb-8 flex flex-col md:flex-row gap-4 hidden">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="search-input" oninput="render()" placeholder="Titre, auteur, genre..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-gold-accent transition-all">
                </div>
                <select id="filter-rating" onchange="render()" class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none font-medium text-slate-600">
                    <option value="all">Toutes les notes</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5+)</option>
                    <option value="3">⭐⭐⭐ (3/5+)</option>
                    <option value="0">Sans note</option>
                </select>
            </div>

            <section id="section-stats" class="view-section active">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="stat-card">
                        <p class="section-label">Livres Lus</p>
                        <div id="stat-count" class="stat-value">0</div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sur un objectif de 100</p>
                    </div>
                    <div class="stat-card">
                        <p class="section-label">Note Moyenne</p>
                        <div id="stat-avg" class="stat-value">0.0</div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Étoiles sur 5</p>
                    </div>
                    <div class="stat-card text-left px-8">
                        <p class="section-label text-center mb-4">Podium des Genres</p>
                        <div id="genre-podium" class="space-y-2"></div>
                    </div>
                </div>
                
                <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                    <p class="section-label mb-6">Rythme de lecture (Livres par mois)</p>
                    <div class="h-64 w-full">
                        <canvas id="readingChart"></canvas>
                    </div>
                </div>
            </section>

            <section id="section-grille" class="view-section">
                <div id="grid-content" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-10"></div>
            </section>

            <section id="section-fiches" class="view-section">
                <div id="fiches-content" class="space-y-20"></div>
            </section>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-6">
                <h2 class="text-2xl font-black uppercase tracking-tight font-serif">Modifier la Fiche #<span id="modal-id"></span></h2>
                <button onclick="fetchBookData()" class="flex items-center gap-2 bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest hover:bg-blue-100 transition-all">
                    <span id="loader-icon" class="hidden"><i class="loader"></i></span>
                    Auto-Remplir
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Titre du livre (pour recherche)</label>
                    <input id="in-title" class="modal-input" placeholder="Titre exact ou partiel...">
                </div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Auteur</label><input id="in-author" class="modal-input"></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Genre</label><input id="in-genre" class="modal-input"></div>
                <div class="md:col-span-2"><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">URL Couverture</label><input id="in-cover" class="modal-input"></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Note</label><select id="in-rating" class="modal-input"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Format</label><select id="in-format" class="modal-input"><option value="-">-</option><option value="Livre">Livre</option><option value="Ebook">Ebook</option><option value="Audiobook">Audiobook</option></select></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Langue</label><input id="in-lang" class="modal-input"></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Début (ex: 01/05)</label><input id="in-start" class="modal-input"></div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Fin (ex: 15/05)</label><input id="in-end" class="modal-input"></div>
            </div>
            <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Résumé Officiel</p>
            <textarea id="in-summary" class="modal-input h-24" placeholder="Résumé..."></textarea>
            <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Mon Avis Personnel</p>
            <textarea id="in-comment" class="modal-input h-24" placeholder="Avis..."></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="closeModal()" class="flex-1 py-4 text-[10px] font-black uppercase bg-slate-50 rounded-xl">Annuler</button>
                <button onclick="saveToFirebase()" class="flex-1 py-4 text-[10px] font-black uppercase btn-gold-main rounded-xl">Enregistrer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALZ0tu1jU2OJbGrAmCcAFXVFB5os4-pfY",
            authDomain: "ma-biblio-b7966.firebaseapp.com",
            projectId: "ma-biblio-b7966",
            storageBucket: "ma-biblio-b7966.firebasestorage.app",
            messagingSenderId: "1025405426041",
            appId: "1:1025405426041:web:75b75d6c45a2f0313ef7a8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let library = [];
        let isSignUp = false;
        let currentUser = null;
        let readingChart = null;

        // --- AUTOMATISATION GOOGLE BOOKS ---
        window.fetchBookData = async () => {
            const titleInput = document.getElementById('in-title').value;
            if (!titleInput) return alert("Veuillez saisir un titre avant de lancer la recherche.");

            const loader = document.getElementById('loader-icon');
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(titleInput)}&maxResults=1&langRestrict=fr`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const info = data.items[0].volumeInfo;
                    
                    // Remplissage des champs
                    document.getElementById('in-title').value = info.title || titleInput;
                    document.getElementById('in-author').value = info.authors ? info.authors.join(', ') : "Inconnu";
                    document.getElementById('in-genre').value = info.categories ? info.categories[0] : "";
                    document.getElementById('in-lang').value = (info.language || "").toUpperCase();
                    document.getElementById('in-summary').value = info.description || "Pas de résumé disponible.";
                    
                    // Gestion Image (On cherche la meilleure qualité)
                    if (info.imageLinks) {
                        let imgUrl = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail;
                        // On force le HTTPS pour éviter les erreurs de chargement
                        imgUrl = imgUrl.replace('http://', 'https://');
                        document.getElementById('in-cover').value = imgUrl;
                    }
                } else {
                    alert("Aucun livre trouvé correspondant à ce titre.");
                }
            } catch (err) {
                console.error(err);
                alert("Erreur lors de la récupération des données.");
            } finally {
                loader.classList.add('hidden');
            }
        };

        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-mode-title').innerText = isSignUp ? "Création de Compte" : "Connexion Membre";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Créer ma bibliothèque" : "Ouvrir ma collection";
            document.getElementById('toggle-auth-btn').innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        };

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (isSignUp) await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerText = user.email;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                setTimeout(() => document.getElementById('app-content').classList.add('opacity-100'), 50);
                await loadUserLibrary();
            } else {
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.logout = () => signOut(auth);

        async function loadUserLibrary() {
            const docRef = doc(db, "users_libs", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                library = docSnap.data().books;
            } else {
                library = Array.from({length: 100}, (_, i) => ({
                    id: i + 1, title: "", author: "", cover: "", rating: 0, summary: "", comment: "", genre: "", format: "-", lang: "", start: "", end: ""
                }));
                await setDoc(docRef, { books: library });
            }
            render();
        }

        window.saveToFirebase = async () => {
            const id = parseInt(document.getElementById('modal-id').innerText);
            const idx = library.findIndex(b => b.id === id);
            library[idx] = {
                id: id,
                title: document.getElementById('in-title').value,
                author: document.getElementById('in-author').value,
                cover: document.getElementById('in-cover').value,
                rating: parseInt(document.getElementById('in-rating').value),
                genre: document.getElementById('in-genre').value,
                format: document.getElementById('in-format').value,
                lang: document.getElementById('in-lang').value,
                start: document.getElementById('in-start').value,
                end: document.getElementById('in-end').value,
                summary: document.getElementById('in-summary').value,
                comment: document.getElementById('in-comment').value
            };
            await setDoc(doc(db, "users_libs", currentUser.uid), { books: library });
            render();
            closeModal();
        };

        window.deleteBook = async (id) => {
            if (!confirm("Supprimer cette fiche et faire remonter les suivantes ?")) return;
            const index = library.findIndex(b => b.id === id);
            if (index === -1) return;
            library.splice(index, 1);
            library.push({
                id: 100, title: "", author: "", cover: "", rating: 0, summary: "", comment: "", genre: "", format: "-", lang: "", start: "", end: ""
            });
            library.forEach((book, i) => { book.id = i + 1; });
            await setDoc(doc(db, "users_libs", currentUser.uid), { books: library });
            render();
        };

        window.render = () => {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const ratingFilter = document.getElementById('filter-rating').value;

            const filtered = library.filter(book => {
                const matchSearch = (book.title || "").toLowerCase().includes(searchTerm) || 
                                    (book.author || "").toLowerCase().includes(searchTerm) || 
                                    (book.genre || "").toLowerCase().includes(searchTerm);
                const matchRating = ratingFilter === "all" ? true : 
                                    ratingFilter === "0" ? book.rating === 0 : 
                                    book.rating >= parseInt(ratingFilter);
                return matchSearch && matchRating;
            });

            const readBooks = library.filter(b => b.title.trim() !== "");
            const totalRead = readBooks.length;
            const avgRating = totalRead > 0 ? (readBooks.reduce((acc, b) => acc + b.rating, 0) / totalRead).toFixed(1) : "0.0";
            
            document.getElementById('stat-count').innerText = totalRead;
            document.getElementById('stat-avg').innerText = avgRating;

            const genreCounts = {};
            readBooks.forEach(b => { if(b.genre) genreCounts[b.genre] = (genreCounts[b.genre] || 0) + 1; });
            const sortedGenres = Object.entries(genreCounts).sort((a,b) => b[1] - a[1]).slice(0, 3);
            
            const podiumColors = ['#C5A059', '#A8A8A8', '#CD7F32'];
            document.getElementById('genre-podium').innerHTML = sortedGenres.length > 0 
                ? sortedGenres.map((g, i) => `
                    <div class="podium-item">
                        <div class="flex items-center gap-3">
                            <span class="rank-badge" style="background:${podiumColors[i]}">${i+1}</span>
                            <span class="text-xs font-bold uppercase truncate w-24">${g[0]}</span>
                        </div>
                        <span class="text-[10px] font-black text-slate-300">${g[1]} livres</span>
                    </div>
                `).join('')
                : '<p class="text-[10px] text-slate-400 text-center italic py-4">Pas encore de données</p>';

            updateChart(readBooks);

            document.getElementById('grid-content').innerHTML = filtered.map(book => `
                <div class="grid-item" onclick="jumpToFiche(${book.id})">
                    <div class="grid-thumb">
                        ${book.cover ? `<img src="${book.cover}" referrerpolicy="no-referrer" class="w-full h-full object-cover">` : `<span class="text-slate-200 font-bold text-xs uppercase tracking-widest">Vide</span>`}
                    </div>
                    <div class="flex gap-0.5">${[1,2,3,4,5].map(i => `<span class="text-[10px] ${i <= book.rating ? 'star-filled' : 'star-empty'}">★</span>`).join('')}</div>
                </div>
            `).join('');

            document.getElementById('fiches-content').innerHTML = filtered.map(book => `
                <div id="fiche-scroll-${book.id}" class="fiche-container">
                    <div class="fiche-number">#${book.id}</div>
                    <button onclick="showSection('grille')" class="mb-6 flex items-center gap-2 px-3 py-1.5 bg-slate-50 hover:bg-gold-50 text-slate-400 rounded-full transition-all">
                         <span class="text-[9px] font-bold uppercase tracking-widest">← Retour Grille</span>
                    </button>
                    <div class="flex flex-col md:flex-row gap-10">
                        <div class="cover-box shrink-0">
                            ${book.cover ? `<img src="${book.cover}" referrerpolicy="no-referrer" class="w-full h-full object-cover">` : `<span class="text-slate-100 font-black text-6xl">?</span>`}
                        </div>
                        <div class="flex-1">
                            <h2 class="fiche-title">${book.title || 'SANS TITRE'}</h2>
                            <h3 class="fiche-author">${book.author || 'AUTEUR INCONNU'}</h3>
                            <div class="mb-6">
                                <p class="section-label">Note :</p>
                                <div class="flex gap-1">${[1,2,3,4,5].map(i => `<span class="text-2xl ${i <= book.rating ? 'star-filled' : 'star-empty'}">★</span>`).join('')}</div>
                            </div>
                            <p class="section-label">Résumé :</p>
                            <p class="fiche-summary">${book.summary || 'Aucun résumé.'}</p>
                        </div>
                    </div>
                    <div class="info-grid">
                        <div class="info-item"><p class="section-label">Début :</p><p class="info-value">${book.start || '—'}</p></div>
                        <div class="info-item"><p class="section-label">Fin :</p><p class="info-value">${book.end || '—'}</p></div>
                        <div class="info-item"><p class="section-label">Genre :</p><p class="info-value">${book.genre || '—'}</p></div>
                        <div class="info-item"><p class="section-label">Format :</p><p class="info-value">${book.format || '—'}</p></div>
                        <div class="info-item"><p class="section-label">Langue :</p><p class="info-value">${book.lang || '—'}</p></div>
                    </div>
                    <div class="mt-8">
                        <p class="section-label">Mon avis personnel :</p>
                        <div class="avis-box"><p class="avis-text">${book.comment || 'Aucun commentaire.'}</p></div>
                    </div>
                    <div class="mt-8 flex justify-end gap-3">
                        <button onclick="deleteBook(${book.id})" class="px-5 py-2 rounded-lg bg-red-50 text-red-400 font-bold uppercase text-[10px] tracking-widest hover:bg-red-100 transition-colors">Supprimer</button>
                        <button onclick="openEdit(${book.id})" class="px-5 py-2 rounded-lg bg-slate-50 text-slate-400 font-bold uppercase text-[10px] tracking-widest hover:text-yellow-600 transition-colors">Modifier</button>
                    </div>
                </div>
            `).join('');
        };

        function updateChart(books) {
            const months = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jun", "Jul", "Aoû", "Sep", "Oct", "Nov", "Déc"];
            const counts = new Array(12).fill(0);
            books.forEach(b => {
                if(b.end && b.end.includes('/')) {
                    const monthPart = parseInt(b.end.split('/')[1]);
                    if(monthPart >= 1 && monthPart <= 12) counts[monthPart - 1]++;
                }
            });
            const ctx = document.getElementById('readingChart').getContext('2d');
            if(readingChart) readingChart.destroy();
            readingChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Livres lus',
                        data: counts,
                        borderColor: '#C5A059',
                        backgroundColor: 'rgba(197, 160, 89, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#C5A059',
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false }, ticks: { stepSize: 1, font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        window.showSection = (id) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            const searchBar = document.getElementById('search-bar-container');
            if(id === 'stats') searchBar.classList.add('hidden');
            else searchBar.classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.jumpToFiche = (id) => {
            showSection('fiches');
            setTimeout(() => {
                const el = document.getElementById('fiche-scroll-' + id);
                if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        };

        window.openEdit = (id) => {
            const b = library.find(x => x.id === id);
            document.getElementById('modal-id').innerText = id;
            document.getElementById('in-title').value = b.title || "";
            document.getElementById('in-author').value = b.author || "";
            document.getElementById('in-cover').value = b.cover || "";
            document.getElementById('in-rating').value = b.rating || 0;
            document.getElementById('in-genre').value = b.genre || "";
            document.getElementById('in-format').value = b.format || "-";
            document.getElementById('in-lang').value = b.lang || "";
            document.getElementById('in-start').value = b.start || "";
            document.getElementById('in-end').value = b.end || "";
            document.getElementById('in-summary').value = b.summary || "";
            document.getElementById('in-comment').value = b.comment || "";
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('edit-modal').classList.add('hidden');
    </script>
</body>
</html>
